# ==============================================================================
# Application Configuration
# ==============================================================================
spring.application.name=order-management
server.port=8080

# ==============================================================================
# Database Configuration (MySQL)
# ==============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/order_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# HikariCP Connection Pool Configuration
# ==============================================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================================================================
# Security / JWT Configuration
# ==============================================================================
# 256-bit secret key for HS256 HMAC algorithm (Base64 encoded or plain 32+ char string)
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Token expiration time in milliseconds: 86400000 ms = 24 hours
application.security.jwt.expiration=86400000
